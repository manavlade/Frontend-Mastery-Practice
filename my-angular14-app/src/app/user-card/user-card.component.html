<div class="flex border-2 border-blue-400 p-4 items-center justify-center cursor-pointer"
     (click)="onClick()">

  <div class="flex-none w-40 h-40 flex items-center justify-center">
    <h1 class="text-5xl font-bold text-blue-800">{{ name }}</h1>
  </div>

  <div class="flex-1 ml-4">
    <h2 class="text-2xl text-blue-700">{{ role }}</h2>

    <span
      [class]="isActive
        ? 'inline-block mt-2 px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-700'
        : 'inline-block mt-2 px-3 py-1 rounded-full text-sm font-semibold bg-gray-200 text-gray-500'">
      {{ isActive ? 'Active' : 'Inactive' }}
    </span>
  </div>

</div>
